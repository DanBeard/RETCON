; MicroRETCON — RAK4631 transport node (RAK19003 base, US915 kit SKU 115093)
;
; Meshtastic-shaped PlatformIO build: Arduino-core on nRF52 (board
; wiscore_rak4631, softdevice s140 6.1.1) — the same coords the meshtastic
; firmware's variants/nrf52840/rak4631 uses, minus its mesh code.
; USB CDC + BLE UART come from the Adafruit nRF52 Arduino core.
;
; Pin authority (no invented pins): ../../docs/MICRORETCON-RAK4630.md,
; verified from meshtastic/firmware variants/nrf52840/rak4631/variant.h.
;
; R1 scope: boot + SX1262 SPI init (DIO2 antenna switch, DIO3 TCXO, DCDC)
; + USB CDC echo + BLE UART echo + battery ADC read. No crns yet (R2).
[platformio]
default_envs = rak4631_micro

[env:rak4631_micro]
; Meshtastic's exact [nrf52_base] platform chain (variants/nrf52840/nrf52.ini):
; platformio/nordicnrf52@11.0.0 + the meshtastic Adafruit_nRF52_Arduino fork
; @ 0fd295f (adds the WisCore_RAK4631_Board BSP variant + C++17 in
; platform.txt). The stock PIO framework package lacks the variant — this
; platform_packages line is what makes board = wiscore_rak4631 resolve.
platform = platformio/nordicnrf52@11.0.0
platform_packages =
  platformio/framework-arduinoadafruitnrf52 @ https://github.com/meshtastic/Adafruit_nRF52_Arduino#0fd295f13203e93df19d578073646ec32f2bf45a
  platformio/toolchain-gccarmnoneeabi@1.90301.200702
board = wiscore_rak4631
framework = arduino
build_flags =
  ; The BSP (meshtastic Adafruit_nRF52_Arduino fork) has no WisCore
  ; variant dir — Meshtastic's trick: the variant.h/cpp live IN THE
  ; VARIANT'S OWN DIR (vendor-provided, verified from
  ; meshtastic/firmware variants/nrf52840/rak4631/) and that dir goes on
  ; the include path. variant.h carries the SX126X_* pin defines itself.
  -I src/variant
  -D RAK_4631
  ; USB CDC = Adafruit TinyUSB (the BSP bundles it). RAK transport posture
  ; needs ONLY CDC — drop the other class drivers (meshtastic nrf52.ini).
  -D USBCON
  -D USE_TINYUSB
  -D CFG_TUD_MSC=0
  -D CFG_TUD_HID=0
  -D CFG_TUD_MIDI=0
  -D CFG_TUD_VENDOR=0
  -D CFG_TUD_VIDEO=0
  -D CFG_TUD_VIDEO_STREAMING=0
monitor_speed = 115200
board_build.ldscript = nrf52840_s140_v6.ld

; RadioLib: the SX1262 driver Meshtastic uses (proven DIO2-as-RF-switch +
; DIO3-TCXO + DCDC handling). Pinned to the version meshtastic's
; radiolib_base uses.
lib_deps =
  https://github.com/jgromes/RadioLib/archive/510e00cfb05bbc3c2b7b524262785454944adb6e.zip
